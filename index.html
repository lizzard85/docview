<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocView</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <select id="lang" title="Language (pick manually if the guess is wrong)"></select>
      <span id="detect-source" class="muted"></span>
      <label class="toggle" title="Format the code (F)"><input type="checkbox" id="opt-format" /> Format</label>
      <label class="toggle" title="Wrap long lines (W)"><input type="checkbox" id="opt-wrap" /> Wrap</label>
      <label class="toggle" title="Show line numbers (L)"><input type="checkbox" id="opt-lines" /> Line no.</label>
      <button id="btn-panel" title="Show tree view (T)" hidden>Tree</button>
      <span class="spacer"></span>
      <span id="info" class="muted"></span>
      <button id="btn-paste" title="Paste from clipboard (Ctrl+V)">Paste</button>
      <button id="btn-open" title="Open file (Ctrl+O)">Open…</button>
      <button id="btn-copy" title="Copy formatted text (Ctrl+Shift+C)">Copy</button>
      <button id="btn-editor" title="Open in external editor (Ctrl+E)">Editor</button>
      <button id="btn-settings" class="icon" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <div id="searchbar" class="searchbar" hidden>
      <input id="search" type="search" placeholder="Search…" spellcheck="false" />
      <span id="search-count" class="muted"></span>
      <button id="search-prev" title="Previous (Shift+Enter)">↑</button>
      <button id="search-next" title="Next (Enter)">↓</button>
      <button id="search-close" title="Close (Esc)">✕</button>
    </div>

    <div id="update-bar" class="notice update-bar" hidden></div>
    <div id="notice" class="notice" hidden></div>

    <div class="workspace">
      <main id="viewer" tabindex="0">
        <div id="empty" class="empty">
          <h1>DocView</h1>
          <p>Paste code with <kbd>Ctrl</kbd>+<kbd>V</kbd>, drop a file here, or press <kbd>Ctrl</kbd>+<kbd>O</kbd>.</p>
          <p class="muted" id="shortcut-hint"></p>
        </div>
        <div id="code" class="code"></div>
      </main>
      <div id="splitter" class="splitter" hidden></div>
      <aside id="side-panel" class="side-panel" hidden>
        <div class="panel-header">
          <strong id="panel-title">Tree</strong>
          <input id="panel-filter" class="tree-only" type="search" placeholder="Filter…" spellcheck="false" />
          <span class="spacer html-only"></span>
          <button id="panel-expand" class="icon tree-only" title="Expand all">+</button>
          <button id="panel-collapse" class="icon tree-only" title="Collapse all">−</button>
          <button id="panel-close" class="icon" title="Close (T)">✕</button>
        </div>
        <div id="panel-body" class="panel-body"></div>
        <div class="panel-footer tree-only">
          <span id="panel-path" class="panel-path muted">Select a node</span>
          <button id="panel-copy-path" title="Copy the path of the selected node" disabled>Copy path</button>
          <button id="panel-copy-value" title="Copy the value of the selected node (Ctrl+C)" disabled>Copy value</button>
        </div>
      </aside>
    </div>

    <dialog id="settings">
      <form method="dialog" id="settings-form">
        <h2>Settings</h2>
        <label>Global shortcut
          <input name="shortcut" placeholder="Super+Alt+V" />
          <small id="shortcut-help">E.g. <code>Super+Alt+V</code> (Super = the Windows key), <code>Ctrl+Shift+F12</code>.</small>
        </label>
        <label>Theme
          <select name="theme">
            <option value="auto">Follow system</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label>Font size <input name="fontSize" type="number" min="8" max="40" /></label>
        <label>Indentation (spaces) <input name="indent" type="number" min="1" max="8" /></label>
        <label>SQL dialect
          <select name="sqlDialect">
            <option value="transactsql">T-SQL (SQL Server)</option>
            <option value="sql">Standard SQL</option>
            <option value="postgresql">PostgreSQL</option>
            <option value="mysql">MySQL</option>
            <option value="mariadb">MariaDB</option>
            <option value="sqlite">SQLite</option>
            <option value="plsql">Oracle PL/SQL</option>
            <option value="db2">DB2</option>
            <option value="bigquery">BigQuery</option>
            <option value="snowflake">Snowflake</option>
          </select>
        </label>
        <label>SQL keywords
          <select name="sqlKeywordCase">
            <option value="preserve">As written</option>
            <option value="upper">UPPERCASE</option>
            <option value="lower">lowercase</option>
          </select>
        </label>
        <label>External editor
          <input name="editorPath" placeholder="Empty = Notepad++ if installed (otherwise Notepad / xdg-open)" />
        </label>
        <label class="row"><input type="checkbox" name="autostart" /> Start automatically at login (runs in the background)</label>
        <label class="row"><input type="checkbox" name="autoUpdate" /> Check for updates automatically</label>
        <p class="update-row"><span id="app-version" class="muted"></span> <button type="button" id="btn-check-update">Check for updates now</button></p>
        <div id="settings-update" class="notice update-bar settings-update" hidden></div>
        <p id="settings-toast" class="muted settings-toast" hidden></p>
        <p id="settings-error" class="error"></p>
        <div class="buttons">
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="save" id="settings-save" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
